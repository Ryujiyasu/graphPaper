<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphPaper 方眼紙専用ソフト</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="description" content="Excel 方眼紙を、方眼紙のためだけに作られたソフトで作る。保存すると普通の .xlsx になり、Excel でそのまま開ける。">
<style>
  :root {
    --ink: #1d2733; --muted: #66727f; --line: #d7dde4; --bg: #eef1f4; --panel: #fff;
    --accent: #1f6feb; --accent-soft: #e4eeff; --danger: #c9372c; --grid: #e3e8ee; --cell: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
  header h1 { display: flex; align-items: center; }
  header h1 .logo { height: 24px; display: block; }
  @media (max-width: 1500px) { header h1 small { display: none; } }
  header h1 small { font-weight: normal; color: var(--muted); font-size: 12px; margin-left: 10px; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, .button { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #aab4bf; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  main { flex: 1; display: flex; min-height: 0; }
  #tools { width: 184px; padding: 12px 10px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  #tools h2, #inspector h2 { font-size: 12px; color: var(--muted); margin: 6px 0 2px; font-weight: normal; }
  #tools button { text-align: left; }
  #tools .stack { display: flex; flex-wrap: wrap; gap: 4px; }
  #tools .stack button { padding: 4px 7px; font-size: 12px; }
  #tools .btabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); gap: 0; }
  #tools .btabs button { border: 0; border-radius: 0; background: none; padding: 4px 6px; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  #tools .btabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  #tools .blist { flex-direction: column; flex-wrap: nowrap; padding-top: 4px; min-height: 120px; }
  #tools .blist button { width: 100%; }
  #tools .blist .mine { display: flex; gap: 3px; }
  #tools .blist .mine button:first-child { flex: 1; }
  #tools .blist .mine button.danger { width: auto; padding: 4px 6px; }
  #tools .minetools { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px dashed var(--line); }
  #tools .minetools .button { font-size: 12px; padding: 4px 7px; text-align: left; }
  .band { position: absolute; left: -6px; right: -6px; border-left: 3px solid var(--accent); background: rgba(31,111,235,.04); pointer-events: none; }
  .bandbar { position: absolute; left: -9px; transform: translateY(-100%); display: flex; gap: 2px; align-items: center; z-index: 5; background: var(--accent); border-radius: 4px 4px 0 0; padding: 1px 2px 1px 6px; }
  .bandbar span { font-size: 11px; color: #fff; margin-right: 4px; white-space: nowrap; }
  .bandbar button { padding: 0 6px; font-size: 11px; line-height: 17px; border: 0; background: rgba(255,255,255,.92); }
  .bandbar button.danger { background: #fff; color: var(--danger); font-weight: 600; }
  button.danger { color: var(--danger); border-color: #e9b4ae; }
  .insertline { position: absolute; left: -8px; right: -8px; height: 0; border-top: 3px solid #12a150; z-index: 6; pointer-events: none; }
  .insertline::before { content: attr(data-label); position: absolute; left: 8px; top: 3px; font-size: 11px; background: #12a150; color: #fff; padding: 0 6px; border-radius: 3px; white-space: nowrap; }
  #preview { position: fixed; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.16); padding: 10px; pointer-events: none; }
  #preview .phead { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  #preview .phead span { color: var(--muted); font-size: 12px; }
  #preview .pbody { position: relative; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px); outline: 1px solid var(--grid); font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #preview .pbox { position: absolute; display: flex; align-items: center; padding: 0 2px; overflow: hidden; white-space: pre; line-height: 1.1; }
  #preview .pbox.b-box { border: 1px solid #000; } #preview .pbox.b-thick { border: 2px solid #000; } #preview .pbox.b-under { border-bottom: 1px solid #000; }
  #preview .pfoot { font-size: 11px; color: var(--muted); margin-top: 6px; max-width: 300px; }
  #preview .pfoot.bad { color: var(--danger); }
  #tools .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  #stage { flex: 1; overflow: auto; padding: 24px; }
  #sheet { margin: 0 auto; width: max-content; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); padding: 57px; overflow: visible; }
  #paper { position: relative; user-select: none; touch-action: none; outline: 1px solid var(--grid); font-family: "Yu Gothic", "游ゴシック", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #paper svg.lines { position: absolute; left: 0; top: 0; pointer-events: none; }
  #paper svg.lines path { stroke: var(--grid); stroke-width: 1; fill: none; }
  body.fill #paper svg.lines { display: none; }
  .pagebreak { position: absolute; left: -57px; right: -57px; border-top: 2px dashed #e0806f; pointer-events: none; z-index: 1; }
  .pagetag { position: absolute; left: -56px; width: 50px; display: flex; flex-direction: column; gap: 2px; align-items: stretch; transform: translateY(2px); z-index: 4; }
  .pagetag span { font-size: 10px; color: var(--muted); text-align: center; }
  .pagetag button { padding: 0; font-size: 11px; line-height: 18px; }
  #tabs { display: flex; gap: 2px; padding: 0 16px; background: var(--bg); border-top: 1px solid var(--line); overflow-x: auto; }
  #tabs .tab { border-radius: 0 0 6px 6px; border-top: 0; font-size: 12px; padding: 5px 14px; background: #f6f8fa; color: var(--muted); }
  #tabs .tab.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
  #tabs .tab.add { padding: 5px 10px; }
  #inspector .size { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 12px; }
  #inspector .size input { width: 62px; font: inherit; padding: 4px; border: 1px solid var(--line); border-radius: 5px; }
  .box { position: absolute; display: flex; align-items: center; padding: 0 3px; overflow: hidden; line-height: 1.25; white-space: pre-wrap; word-break: break-all; }
  .box.top { align-items: flex-start; padding-top: 2px; }
  .box > .t { width: 100%; }
  .box.b-box { border: 1px solid #000; }
  .box.b-thick { border: 2px solid #000; }
  .box.b-under { border-bottom: 1px solid #000; }
  .box.input:not(.filled) { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(31,111,235,.06) 6px 12px); }
  .box .tag { position: absolute; right: 2px; top: 1px; font-size: 9px; color: var(--accent); opacity: .75; pointer-events: none; white-space: nowrap; }
  .box.selected { outline: 2px solid var(--accent); outline-offset: -1px; z-index: 2; }
  .box .handle { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; background: var(--accent); cursor: nwse-resize; display: none; }
  .box.selected .handle { display: block; }
  .box.stamp .t { color: #808080; }
  .ghost { position: absolute; border: 2px dashed var(--accent); background: rgba(31,111,235,.08); pointer-events: none; z-index: 3; }
  .ghost.bad { border-color: var(--danger); background: rgba(201,55,44,.08); }
  .ghost.capture { border-color: #12a150; background: rgba(18,161,80,.08); }
  .box textarea, .box input, .box select { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 2px 3px; font: inherit; background: rgba(255,255,230,.95); resize: none; outline: 2px solid var(--accent); }
  .box .opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .box .opts label { cursor: pointer; }
  body.fill .box.input, body.fill .box.check { cursor: text; }
  body.fill .box.input:hover, body.fill .box.check:hover { background: #fffbe6; }
  #inspector { width: 240px; padding: 12px; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; font-size: 13px; }
  #inspector .row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
  #inspector label.inline { flex-direction: row; display: flex; gap: 6px; align-items: center; }
  #inspector input[type=text], #inspector select, #inspector textarea { font: inherit; padding: 5px 6px; border: 1px solid var(--line); border-radius: 5px; width: 100%; }
  #inspector textarea { min-height: 56px; resize: vertical; }
  #inspector .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  #inspector .seg button { padding: 4px 7px; font-size: 12px; }
  #inspector .where { font-size: 12px; color: var(--muted); }
  #inspector .empty { color: var(--muted); line-height: 1.7; }
  footer { display: flex; gap: 16px; padding: 5px 16px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
  footer .status.error { color: var(--danger); }
  footer .zoom { display: inline-flex; gap: 4px; align-items: center; }
  footer .zoom button { padding: 0 6px; font-size: 12px; line-height: 16px; }
  #toast { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); background: #1d2733; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; z-index: 20; }
  #toast.show { opacity: .95; }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(880px, 94vw); }
  dialog header { justify-content: space-between; }
  dialog.ask { width: min(420px, 92vw); padding: 18px 20px; }
  dialog.ask p { margin: 0 0 12px; line-height: 1.6; }
  dialog.ask input { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 14px; }
  dialog.ask .bar { justify-content: flex-end; }
  dialog .body { padding: 12px 16px; }
  dialog iframe { width: 100%; height: 70vh; border: 1px solid var(--line); }
  dialog textarea { width: 100%; height: 60vh; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  @media (max-width: 900px) { #tools { width: 108px; } #inspector { display: none; } body.has-selection #inspector { display: block; position: fixed; right: 0; top: 0; bottom: 0; z-index: 10; box-shadow: -2px 0 8px rgba(0,0,0,.15); } }
</style>
</head>
<body>
<header>
  <h1><img src="assets/logo.svg" alt="GraphPaper" class="logo"><small>方眼紙専用ソフト。保存すると、Excel でそのまま開ける</small></h1>
  <div class="bar">
    <button id="mode-design" class="on" title="枠を描いて様式を作る">作る</button>
    <button id="mode-fill" title="作った様式に記入する">記入する</button>
    <span class="sep"></span>
    <button id="new">新規</button>
    <button id="sample">見本</button>
    <label class="button" title="Excel 方眼紙を開くと、入力欄を見つけて枠に直します">開く<input id="file" type="file" accept=".xlsx,.xlsm" hidden></label>
    <button id="save-xlsx" class="primary">Excel で保存</button>
    <button id="pdf">PDF</button>
    <button id="markdown" title="様式と記入値を、AI にも読める文字に">AI 用に書き出す</button>
  </div>
</header>
<main>
  <aside id="tools">
    <h2>ブロック（押すと差し込む）</h2>
    <div id="block-tabs" class="btabs"></div>
    <div id="blocks" class="stack blist"></div>
    <h2>枠を描く（ドラッグ）</h2>
    <div id="kinds" class="stack"></div>
    <p class="hint">ブロックは選んでいる枠の下に、何も選んでいなければいちばん下に入ります。消すときは、ブロックの上に出る「✕ 削除」で。<br>方眼の上をドラッグすると枠ができます。枠はドラッグで移動、右下の角で大きさを変えられます。<br>ダブルクリックか文字キーで文字を入力。Delete で削除、Ctrl+Z で元に戻す。</p>
  </aside>
  <section id="stage"><div id="sheet"><div id="paper"></div></div></section>
  <aside id="inspector"></aside>
</main>
<nav id="tabs"></nav>
<footer>
  <span class="zoom"><button id="zoom-out" title="縮小">－</button><span id="zoom">100%</span><button id="zoom-in" title="拡大">＋</button></span>
  <span id="gridinfo"></span>
  <span class="status" id="status"></span>
</footer>
<div id="toast"></div>
<div id="preview" hidden></div>
<dialog id="ask" class="ask"><p id="ask-text"></p><input id="ask-input" type="text"><div class="bar"><button id="ask-no">やめる</button><button id="ask-yes" class="primary">OK</button></div></dialog>
<dialog id="dlg"><header><strong id="dlg-title"></strong><span class="bar" id="dlg-actions"></span></header><div class="body" id="dlg-body"></div></dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
